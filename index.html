</style></head><body>
<main id="app"></main><nav id="nav" aria-label="Main"></nav>
<script>
'use strict';
/* =====================================================================
   MONTH MATRIX
   Fill it in once a month. Every category, every month, compared, graphed, targeted and streaked.
   One file, vanilla JS, works offline.

   THE MONTHLY ENTRY mirrors the Monzo "Money out" breakdown: starting balance, money in, one total per category.
   Investments and Emergency fund are extra categories, so what you put away is tracked like everything else.

   SECTIONS  1 Config · 2 Utilities · 3 State · 4 Month maths · 5 Comparisons · 6 Targets & scoring · 7 Streaks
             8 Savings projections · 9 Charts · 10 Views · 11 Actions · 12 Export/import · 13 Boot
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG
   --------------------------------------------------------------------- */
const APP = 'Month Matrix', KEY = 'mm_v1';
/* kinds decide how a target is judged:
   need  = stay at or under (5% slack)    want  = stay under     avoid = lower is better, stay under
   ignore = transfers/pending: left out of spending stats    save = going over target is the win */
const KINDS = {
  need: { name: 'Needs', blurb: 'Stay at or under target (5% slack)', col: '#5B7FA6' },
  want: { name: 'Wants', blurb: 'Stay under target', col: '#8E6BBF' },
  avoid: { name: 'Avoidable', blurb: 'Things you wish you had skipped: lower is better', col: '#D9622B' },
  ignore: { name: 'Ignored', blurb: 'Transfers and pending: left out of spending stats', col: '#8FA3B5' },
  save: { name: 'Saving', blurb: 'Over target is a win', col: '#4C7A46' }
};
const KIND_ORDER = ['need', 'want', 'avoid', 'ignore', 'save'];
/* In the order your Monzo summary lists them, then the two savings categories. */
const DEFAULT_CATS = [
  { id: 'c_ess', name: 'Essentials', kind: 'need', icon: '🏠', tgt: 0 },
  { id: 'c_hol', name: 'Holiday and leisure', kind: 'want', icon: '🌍', tgt: 0 },
  { id: 'c_ign', name: 'Ignore/Transfers', kind: 'ignore', icon: '🔁', tgt: 0 },
  { id: 'c_avd', name: 'Could have avoided', kind: 'avoid', icon: '🛍️', tgt: 0 },
  { id: 'c_wrk', name: 'Work and necessary travel', kind: 'need', icon: '🚆', tgt: 0 },
  { id: 'c_lif', name: 'Lifestyle', kind: 'want', icon: '☕', tgt: 0 },
  { id: 'c_pen', name: 'Pending', kind: 'ignore', icon: '⏳', tgt: 0 },
  { id: 'c_ccp', name: 'Credit card pay off', kind: 'ignore', icon: '💳', tgt: 0 },
  { id: 'c_stg', name: 'Stag', kind: 'want', icon: '😀', tgt: 0 },
  { id: 'c_inv', name: 'Investments', kind: 'save', role: 'inv', icon: '📈', tgt: 0 },
  { id: 'c_ef', name: 'Emergency fund', kind: 'save', role: 'ef', icon: '🛟', tgt: 0 }
];
const HIT = 0.8;                 // a month is a "hit" when this share of your targets are met
const NEED_SLACK = 0.05;
const DEFAULTS = { name: '', cur: '£', saveRate: 20, efMonths: 3, invRate: 7, invGoal: 1000000, efGoal: 0 };
const PALETTE = ['#D9622B', '#4C7A46', '#5B7FA6', '#B4690E', '#8E6BBF', '#C2477A', '#2A9D8F', '#9A7B4F', '#E0A800', '#3E7CB1', '#7A8450', '#B5524A', '#6B7FD7', '#C98B2B'];

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const ds = o => { const d = new Date(); d.setDate(d.getDate() + o); return fmt(d); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pc = x => Math.round(x * 100);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r2 = x => Math.round((+x || 0) * 100) / 100;
const cur = () => (S && S.cfg.cur) || '£';
const M = (n, dp) => { const v = Math.abs(+n || 0), s = dp ? v.toLocaleString('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp }) : Math.round(v).toLocaleString('en-GB'); return ((+n || 0) < 0 && Math.round(v * (dp ? 100 : 1)) !== 0 ? '−' : '') + cur() + s; };
const sgM = (n, dp) => (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + cur() + Math.abs(+n || 0).toLocaleString('en-GB', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
const ym = (y, m) => y + '-' + String(m).padStart(2, '0');
const addM = (k, n) => { const t = +k.slice(0, 4) * 12 + (+k.slice(5) - 1) + n; return ym(Math.floor(t / 12), (t % 12) + 1); };
const diffM = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5) - +a.slice(5));
const mLab = (k, long) => new Date(k + '-15T12:00:00').toLocaleDateString('en-GB', { month: long ? 'long' : 'short', year: long ? 'numeric' : '2-digit' });
const curMonth = () => ds(0).slice(0, 7);
const bar = (v, cls) => `<div class="bar ${cls || ''}" role="progressbar" aria-valuenow="${pc(clamp(v, 0, 1))}" aria-valuemin="0" aria-valuemax="100"><i style="width:${clamp(v, 0, 1) * 100}%"></i></div>`;

/* ---------------------------------------------------------------------
   3. STATE
   S = { v, cfg, cats:[{id,name,kind,icon,tgt,role?}], months:{ 'YYYY-MM': { sb, in, eb, v:{catId:amount}, tg:{catId:target}, b:{catId:balance}, note } }, created, lastExport }
   sb/eb = starting/ending balance (optional). tg = the targets that applied that month (a snapshot, so changing targets doesn't rewrite history).
   b = optional end-of-month balance for a saving category (the investments pot, the emergency fund).
   --------------------------------------------------------------------- */
let S = null, V = 'home', SEL = null, MSG = '', RST = 0, DT = false, IMPQ = null, IMPERR = '', CSVT = '', DNOTE = '', SERR = '', ME = null, CE = null, DELM = '', _c = {};
function save() { _c = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { MSG = 'Changes could not be saved in this browser. Export a backup before closing.'; } }
function newState(cfg) { return { v: 1, cfg: Object.assign({}, DEFAULTS, cfg), cats: DEFAULT_CATS.map(c => Object.assign({}, c)), months: {}, created: ds(0), lastExport: null }; }
function migrate(raw) {
  if (!raw || typeof raw !== 'object' || !raw.cfg) return null;
  const n0 = x => isFinite(+x) ? +x : 0, n = newState({ cur: String(raw.cfg.cur || '£').slice(0, 3), name: String(raw.cfg.name || '').slice(0, 24), saveRate: n0(raw.cfg.saveRate) || 20, efMonths: n0(raw.cfg.efMonths) || 3, invRate: n0(raw.cfg.invRate), invGoal: n0(raw.cfg.invGoal) || 1000000, efGoal: n0(raw.cfg.efGoal) });
  n.cfg.plan = cleanPlan(raw.cfg.plan);
  n.created = raw.created || ds(0); n.lastExport = raw.lastExport || null;
  if (Array.isArray(raw.cats) && raw.cats.length) n.cats = raw.cats.filter(c => c && c.id && c.name).slice(0, 24).map(c => ({ id: String(c.id), name: String(c.name).slice(0, 30), kind: KINDS[c.kind] ? c.kind : 'want', icon: String(c.icon || '•').slice(0, 4), tgt: Math.max(0, n0(c.tgt)), role: c.role === 'inv' || c.role === 'ef' ? c.role : undefined }));
  const ids = n.cats.map(c => c.id);
  Object.keys(raw.months && typeof raw.months === 'object' ? raw.months : {}).forEach(k => {
    if (!/^\d{4}-\d{2}$/.test(k)) return; const m = raw.months[k] || {}, o = { sb: m.sb == null || m.sb === '' ? null : n0(m.sb), in: n0(m.in), eb: m.eb == null || m.eb === '' ? null : n0(m.eb), v: {}, tg: {}, b: {}, note: String(m.note || '').slice(0, 120) };
    ['v', 'tg', 'b'].forEach(f => Object.keys(m[f] && typeof m[f] === 'object' ? m[f] : {}).forEach(id => { if (ids.includes(id) && m[f][id] !== '' && m[f][id] != null && isFinite(+m[f][id])) o[f][id] = r2(m[f][id]); }));
    n.months[k] = o;
  });
  return n;
}
function load() { try { return migrate(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return null; } }

/* ---------------------------------------------------------------------
   4. MONTH MATHS
   --------------------------------------------------------------------- */
const MK = () => _c.mk || (_c.mk = Object.keys(S.months).sort());
const mo = k => S.months[k] || null;
const latestK = () => { const a = MK(); return a.length ? a[a.length - 1] : null; };
const catById = id => S.cats.find(c => c.id === id);
const role = r => S.cats.find(c => c.role === r);
const val = (k, id) => { const m = S.months[k]; return m && m.v[id] != null ? m.v[id] : 0; };
const has = (k, id) => { const m = S.months[k]; return !!(m && m.v[id] != null); };
const kinds = ks => S.cats.filter(c => ks.includes(c.kind));
const sumK = (k, ks) => kinds(ks).reduce((s, c) => s + val(k, c.id), 0);
const spendOf = k => sumK(k, ['need', 'want', 'avoid']);
const ignoredOf = k => sumK(k, ['ignore']);
const savedOf = k => sumK(k, ['save']);
const outOf = k => spendOf(k) + ignoredOf(k) + savedOf(k);
const inOf = k => { const m = S.months[k]; return m ? m.in : 0; };
const leftOf = k => inOf(k) - outOf(k);
const rateOf = k => inOf(k) > 0 ? savedOf(k) / inOf(k) : null;
const tgOf = (k, c) => { const m = S.months[k]; return m && m.tg[c.id] != null ? m.tg[c.id] : c.tgt; };
/* the figure a month is judged on for a metric */
const METRICS = {
  in: { n: 'Money in', f: inOf, good: 1 }, spend: { n: 'Spending', f: spendOf, good: -1 }, saved: { n: 'Saved', f: savedOf, good: 1 }, left: { n: 'Left over', f: leftOf, good: 1 },
  need: { n: 'Needs', f: k => sumK(k, ['need']), good: -1 }, want: { n: 'Wants', f: k => sumK(k, ['want']), good: -1 }, avoid: { n: 'Avoidable', f: k => sumK(k, ['avoid']), good: -1 }, out: { n: 'Money out (all)', f: outOf, good: -1 }
};
/* mean of f over the n calendar months before k that have data */
function winAvg(f, k, n) { const v = []; for (let i = 1; i <= n; i++) { const kk = addM(k, -i); if (mo(kk)) v.push(f(kk)); } return { avg: mean(v), n: v.length }; }
function cmp(f, k) { const p = addM(k, -1), ly = addM(k, -12); return { cur: f(k), prev: mo(p) ? f(p) : null, a3: winAvg(f, k, 3).avg, a12: winAvg(f, k, 12).avg, ly: mo(ly) ? f(ly) : null }; }
function slope(vals) {   // least-squares change per step over an array (nulls skipped)
  const p = vals.map((y, x) => y == null ? null : { x, y }).filter(Boolean); if (p.length < 3) return null;
  const mx = mean(p.map(q => q.x)), my = mean(p.map(q => q.y)); let sxx = 0, sxy = 0; p.forEach(q => { sxx += (q.x - mx) ** 2; sxy += (q.x - mx) * (q.y - my); }); return sxx ? sxy / sxx : null;
}
/* the balance trail: your own ending balance if you entered one, else the last known one carried by money left over */

  (s.values ? s.values.rows : []).forEach(r => { const m = raw.months[nm(r[0])]; if (!m) return; if (num(r[3]) != null) m.v[r[1]] = num(r[3]); if (num(r[4]) != null) m.tg[r[1]] = num(r[4]); if (num(r[5]) != null) m.b[r[1]] = num(r[5]); });
  if (s.plan && s.plan.rows[0]) { try { raw.cfg.plan = JSON.parse(s.plan.rows[0][1]); } catch (e) { throw new Error('Invalid plan'); } }
  const g = migrate(raw); if (!g) throw new Error('bad'); return g;
}
function exportCSV() {

  try { const u = URL.createObjectURL(new Blob([CSVT], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a'); a.href = u; a.download = 'month-matrix-' + ds(0) + '.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); DNOTE = 'Spreadsheet exported. Keep the file somewhere safe.'; } catch (e) { DNOTE = 'Your browser blocked the download. Copy the text below into a file called month-matrix.csv.'; } render();
}
function importFile(inp) {

}

function dataCard() {

   ${DNOTE ? `<div class="note" role="status">${esc(DNOTE)}</div>` : ''}${CSVT ? `<textarea class="csvbox" readonly aria-label="Exported spreadsheet text" onfocus="this.select()">${esc(CSVT)}</textarea>` : ''}
   <div class="mt"><label>Import a Month Matrix spreadsheet<input type="file" accept=".csv,text/csv" onchange="importFile(this)"></label></div>${IMPERR ? `<div class="bad mt" role="alert">${esc(IMPERR)}</div>` : ''}${q}</div>`;
}


/* Target-led plan. All contributions are end-of-month; annual returns are effective. */
function cleanPlan(raw) {
  const p = raw && typeof raw === 'object' ? raw : {}, out = {};
  for (const k of ['income','buffer','invested','cash','fundGoal']) if (p[k] !== '' && p[k] != null && Number.isFinite(+p[k]) && +p[k]>=0) out[k]=Math.min(1e9,+p[k]);
  if (Number.isFinite(+p.years)) out.years=clamp(Math.round(+p.years),1,50);
  if (Number.isFinite(+p.rate)) out.rate=clamp(+p.rate,-20,30);
  return out;
}
function planInputs() {
  const p=cleanPlan(S.cfg.plan), last=latestK();
  return {...p,income:p.income ?? (last?inOf(last):0),buffer:p.buffer ?? 0,invested:p.invested ?? Math.max(0,potState('inv')?.bal||0),cash:p.cash ?? Math.max(0,potState('ef')?.bal||0),fundGoal:p.fundGoal ?? (S.cfg.efGoal || efTarget().target || 0),years:p.years ?? 20,rate:p.rate ?? S.cfg.invRate};
}
function planBudget(p, actual=false) {
  const last=latestK(), spending=kinds(['need','want','avoid']).reduce((a,c)=>a+(actual&&last?val(last,c.id):c.tgt),0);
  const other=kinds(['save']).filter(c=>!['inv','ef'].includes(c.role)).reduce((a,c)=>a+c.tgt,0);
  const available=p.income-spending-p.buffer-other;
  const ef=Math.max(0,role('ef')?.tgt||0), desiredInv=Math.max(0,role('inv')?.tgt||0);
  return {spending,other,available,ef,desiredInv};
}
function projectPlan(p,b,rate=p.rate) {
  let cash=p.cash, inv=p.invested, paid=p.invested, reached=cash>=p.fundGoal?0:null, goal=inv>=S.cfg.invGoal?0:null;
  const monthly=Math.pow(1+rate/100,1/12)-1, rows=[{month:0,inv,paid,cash,deposit:0}];
  for(let month=1;month<=p.years*12;month++) {
    const room=Math.max(0,b.available), toCash=Math.min(room,b.ef,Math.max(0,p.fundGoal-cash)), deposit=room-toCash;
    cash+=toCash; paid+=deposit; inv=inv*(1+monthly)+deposit;
    if(reached===null && cash>=p.fundGoal-0.005) reached=month;
    if(goal===null && inv>=S.cfg.invGoal) goal=month;
    rows.push({month,inv,paid,cash,deposit});
  }
  return {rows,reached,goal,end:rows.at(-1)};
}
function planChange(el,key) {
  if(!el.checkValidity() || el.value==='' || !Number.isFinite(+el.value)){el.reportValidity();return;}
  S.cfg.plan={...cleanPlan(S.cfg.plan),[key]:+el.value};save();render();
}
function planTarget(el,index) {
  if(!el.checkValidity() || el.value===''){el.reportValidity();return;}
  S.cats[index].tgt=+el.value;save();render();
}
function vHome() {
  const p=planInputs(),b=planBudget(p),sim=projectPlan(p,b),base=projectPlan(p,b,0),last=latestK(),actual=projectPlan(p,planBudget(p,true));
  const money=(key,label,value,min=0,max=1e9,step='0.01')=>`<label>${label}<input aria-label="${esc(label)}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" value="${value}" onchange="planChange(this,'${key}')"></label>`;
  const target=(c)=>`<div class="targetrow"><div><b>${esc(c.icon)} ${esc(c.name)}</b>${last?`<div class="mu sm">Last month: ${M(val(last,c.id))}</div>`:''}</div><label><span class="sm">${esc(cur())} / month</span><input aria-label="${esc(c.name)} monthly target" type="number" inputmode="decimal" min="0" max="1000000000" step="0.01" value="${c.tgt}" onchange="planTarget(this,${S.cats.indexOf(c)})"></label></div>`;
  const first=sim.rows[1], ready=b.available>=0, missing=kinds(['need','want','avoid']).every(c=>c.tgt===0),date=n=>mLab(addM(curMonth(),n),true);
  const end=sim.end, years=[1,5,10,20,30,p.years].filter((x,i,a)=>x<=p.years&&a.indexOf(x)===i).sort((a,b)=>a-b);
  const graph=chart({span:p.years,zero:true,H:205,layers:[{type:'line',c:'var(--lf)',pts:sim.rows.filter(r=>r.month%12===0).map(r=>({x:r.month/12,y:r.inv}))},{type:'line',c:'var(--ac)',dash:'4 4',pts:base.rows.filter(r=>r.month%12===0).map(r=>({x:r.month/12,y:r.inv}))}],xl:[{x:0,t:'Now'},{x:p.years/2,t:`${p.years/2} years`},{x:p.years,t:`${p.years} years`}]});
  return `<header class="plantop"><div class="eyebrow">Month Matrix · Your money, with a purpose</div><h2>Targets → future wealth</h2><p class="mu">Stick to your monthly plan. See what you can invest, and what it could become.</p></header>
  ${MSG?`<div class="note" role="status">${esc(MSG)}</div>`:''}
  ${missing?'<div class="note">Start by entering your income and spending targets below. Zero means no planned spending; the projection is only as complete as your budget.</div>':''}
  <section class="planhero"><div class="eyebrow">If you meet your spending targets</div><div class="big">${M(first.deposit)}<span style="font-size:17px"> / month</span></div><p>could go into investments from next month.</p><div class="mu">${first.cash>p.cash?`${M(first.cash-p.cash)} also goes to your emergency fund.`:'Your available surplus goes straight to investments.'}</div></section>
  ${!ready?`<div class="card planalert" role="alert"><b>Your plan is ${M(-b.available)} over budget each month.</b><p>Reduce targets or increase income before treating this as an affordable investment plan. The projection adds no new money while this shortfall persists.</p></div>`:''}
  <section class="card"><h3><span class="stepnum">1</span>Your monthly budget</h3><div class="row mt">${money('income','Take-home income / month',p.income)}${money('buffer','Keep unallocated / month',p.buffer)}</div>
  <p class="mu sm">Include all spending, debt payments and annual costs divided by 12. Record card purchases in their spending categories once; do not count the card repayment again.</p>
  ${kinds(['need','want','avoid']).map(target).join('')}
  <div class="row mt"><button class="chip" onclick="go('settings')">Manage categories</button>${last?'<button class="chip" onclick="applySuggest()">Suggest blank targets</button>':''}</div>
  <div class="flowline"><span>Income</span><b>${M(p.income)}</b></div><div class="flowline"><span>− Spending targets</span><b>${M(b.spending)}</b></div><div class="flowline"><span>− Unallocated buffer</span><b>${M(p.buffer)}</b></div>${b.other?`<div class="flowline"><span>− Other saving targets</span><b>${M(b.other)}</b></div>`:''}<div class="flowline"><strong>Available for fund + investing</strong><strong>${M(b.available)}</strong></div>

  ${role('ef')?target(role('ef')):'<p class="mu">Add an emergency-fund category in Settings to fund this goal.</p>'}

  <div class="note">${sim.reached===0?`Fund target already covered. Invest ${M(Math.max(0,b.available))} per month.`:sim.reached!==null?`Fund reaches ${M(p.fundGoal)} in <b>${date(sim.reached)}</b>. From the following month, invest <b>${M(Math.max(0,b.available))}/month</b> — an extra ${M(first.cash-p.cash)} compared with next month.`:`Fund target is not reached within ${p.years} years at this allocation. Increase the fund contribution or adjust the target.`}</div>
  <p class="mu sm">The final fund payment is capped at the remaining gap; the rest goes into investments that month. Cash earns 0% in this model.</p></section>
  <section class="card"><h3><span class="stepnum">3</span>Watch the plan compound</h3><div class="row mt">${money('invested','Investments now',p.invested)}${money('rate','Assumed annual return (%)',p.rate,-20,30,'0.1')}${money('years','Years ahead',p.years,1,50,'1')}</div>
  <div class="tiles t2"><div class="tile"><b>${M(end.inv)}</b><span>Investments in ${p.years} years at ${p.rate}%</span></div><div class="tile"><b>${M(end.inv-end.paid)}</b><span>Modelled growth / loss</span></div></div>
  <div class="planchart" role="img" aria-label="Investment projection compared with starting investments plus future contributions">${graph}</div><div class="lg"><i style="background:var(--lf)"></i>At ${p.rate}% a year</div><div class="lg"><i style="background:var(--ac)"></i>Starting pot + contributions (0%)</div>
  <div class="flowline"><span>Starting investments + new contributions</span><b>${M(end.paid)}</b></div><div class="flowline"><span>Emergency cash at year ${p.years}</span><b>${M(end.cash)}</b></div><div class="flowline"><strong>Modelled investments + emergency cash</strong><strong>${M(end.inv+end.cash)}</strong></div>
  <p class="mu sm">Investment goal: ${M(S.cfg.invGoal)}. ${sim.goal===0?'Already reached.':sim.goal!==null?`Reached in ${date(sim.goal)} in this scenario.`:`Not reached within ${p.years} years.`} Edit the goal in Settings.</p>
  ${b.desiredInv>first.deposit?`<div class="note">Your saved investment target is ${M(b.desiredInv)}/month; this budget initially supports ${M(first.deposit)}. Investment targets are not added on top of the available surplus.</div>`:''}
  ${last?`<div class="note"><b>The value of meeting your targets</b><p>Repeating ${mLab(last,true)} spending with the same income and fund settings gives ${M(actual.end.inv)} in investments after ${p.years} years. Your target plan gives ${sgM(end.inv-actual.end.inv)} compared with that.</p></div>`:''}
  <details class="mt"><summary>Year-by-year milestones & return scenarios</summary><div class="mx"><table class="tbl"><thead><tr><th>Years</th><th>0% return</th><th>${p.rate}% return</th><th>Cash</th></tr></thead><tbody>${years.map(y=>`<tr><td>${y}</td><td>${M(base.rows[y*12].inv)}</td><td>${M(sim.rows[y*12].inv)}</td><td>${M(sim.rows[y*12].cash)}</td></tr>`).join('')}</tbody></table></div><p class="mu sm">At ${Math.max(-20,p.rate-3)}%: ${M(projectPlan(p,b,Math.max(-20,p.rate-3)).end.inv)} · At ${Math.min(30,p.rate+3)}%: ${M(projectPlan(p,b,Math.min(30,p.rate+3)).end.inv)} after ${p.years} years. These are scenarios, not confidence bounds.</p></details></section>
  <p class="planfoot">Illustration, not a guaranteed return. A ${p.rate}% effective annual return is compounded monthly, with deposits at month-end starting next month. Income and targets stay fixed. Values are future pounds, before fees, tax and inflation. This is a projection of these two pots, not total net worth; it excludes pensions, property and debts. Inputs save in this browser; export a backup in Settings to move your data.</p>`;
}
